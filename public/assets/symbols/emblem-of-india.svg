<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E6A100" />
      <stop offset="70%" stop-color="#B37B00" />
      <stop offset="100%" stop-color="#7A5200" />
    </linearGradient>
    <filter id="emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- Central Lion Profile -->
    <!-- Lion Heads & Manes -->
    <path d="M150 25 C132 25 125 42 128 58 C122 52 110 50 102 58 C96 64 94 74 98 84 C88 80 75 85 72 98 C68 112 76 126 88 132 C82 142 84 156 94 164 C104 172 118 170 128 162 C134 172 146 178 150 178 C154 178 166 172 172 162 C182 170 196 172 206 164 C216 156 218 142 212 132 C224 126 232 112 228 98 C225 85 212 80 202 84 C206 74 204 64 198 58 C190 50 178 52 172 58 C175 42 168 25 150 25 Z" fill="url(#emblemGold)"/>

    <!-- Lion Facial Features & Details (Central Lion) -->
    <path d="M142 55 Q150 48 158 55 Q150 62 142 55 Z" fill="#4A3400"/>
    <circle cx="138" cy="46" r="3" fill="#4A3400"/>
    <circle cx="162" cy="46" r="3" fill="#4A3400"/>
    <path d="M136 68 Q150 78 164 68 Q150 82 136 68 Z" fill="#4A3400"/>

    <!-- Left Lion Facial Details -->
    <circle cx="106" cy="72" r="2.5" fill="#4A3400"/>
    <path d="M102 82 Q110 88 118 84" stroke="#4A3400" stroke-width="2" fill="none"/>

    <!-- Right Lion Facial Details -->
    <circle cx="194" cy="72" r="2.5" fill="#4A3400"/>
    <path d="M198 82 Q190 88 182 84" stroke="#4A3400" stroke-width="2" fill="none"/>

    <!-- Abacus (Circular Base Platform) -->
    <rect x="50" y="178" width="200" height="42" rx="6" fill="url(#emblemGold)" stroke="#5C4000" stroke-width="2"/>
    <rect x="56" y="184" width="188" height="30" rx="4" fill="none" stroke="#FFF" stroke-width="1" opacity="0.4"/>

    <!-- Ashoka Chakra Wheel in Center of Abacus -->
    <circle cx="150" cy="199" r="16" fill="#000080" stroke="url(#emblemGold)" stroke-width="2.5"/>
    <circle cx="150" cy="199" r="3" fill="#FFF"/>
    <!-- 24 Spokes -->
    <path d="
      M150 183 L150 215 M134 199 L166 199
      M138.7 187.7 L161.3 210.3 M138.7 210.3 L161.3 187.7
      M135.2 193 L164.8 205 M135.2 205 L164.8 193
      M144 184.2 L156 213.8 M156 184.2 L144 213.8
    " stroke="#FFF" stroke-width="1"/>

    <!-- Galloping Horse (Left Side of Abacus) -->
    <path d="M82 192 C78 186 68 188 64 194 C60 200 66 206 72 206 C78 206 84 200 82 192 Z" fill="#4A3400"/>

    <!-- Bull (Right Side of Abacus) -->
    <path d="M218 192 C222 186 232 188 236 194 C240 200 234 206 228 206 C222 206 216 200 218 192 Z" fill="#4A3400"/>

    <!-- Inverted Lotus Bell Base -->
    <path d="M65 220 L235 220 C225 265 205 285 150 285 C95 285 75 265 65 220 Z" fill="url(#emblemGold)" stroke="#5C4000" stroke-width="2"/>
    <!-- Lotus Petal Flares -->
    <path d="M85 220 Q105 260 115 280 M120 220 Q135 265 140 284 M180 220 Q165 265 160 284 M215 220 Q195 260 185 280" stroke="#7A5200" stroke-width="2" fill="none"/>

    <!-- Lower Plinth Step -->
    <rect x="75" y="288" width="150" height="14" rx="3" fill="url(#emblemGold)" stroke="#5C4000" stroke-width="1.5"/>

    <!-- Official Devanagari Motto: सत्यमेव जयते -->
    <text x="150" y="348" text-anchor="middle" fill="url(#emblemGold)" font-family="'Noto Sans Devanagari', 'Tiro Devanagari Hindi', 'Kokila', 'Mangal', serif" font-weight="900" font-size="34" letter-spacing="2">సత్యమేవ జయతే</text>
    <text x="150" y="388" text-anchor="middle" fill="url(#emblemGold)" font-family="'Noto Sans Devanagari', 'Tiro Devanagari Hindi', 'Kokila', 'Mangal', serif" font-weight="900" font-size="28" letter-spacing="3">सत्यमेव जयते</text>
  </g>
</svg>
