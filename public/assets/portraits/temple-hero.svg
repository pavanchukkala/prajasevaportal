<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-main, #060f1a)" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="var(--bg-surface, #0d2137)" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  <!-- Ambient Gold Ray Lines -->
  <line x1="600" y1="0" x2="200" y2="600" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="0" x2="1000" y2="600" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="0" x2="400" y2="600" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="0" x2="800" y2="600" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
  <!-- Smooth Swarnamukhi River Wave at Base -->
  <path d="M 0 520 Q 300 490 600 530 T 1200 500 L 1200 600 L 0 600 Z" fill="url(#goldGrad)" opacity="0.15"/>
</svg>
